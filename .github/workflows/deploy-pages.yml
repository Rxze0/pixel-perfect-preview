name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install

      - name: Build static site
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
        run: |
          bunx vite build
          # Output folder differs by build environment: dist/client or .output/public.
          OUT=""
          for d in dist/client .output/public; do
            if [ -d "$d" ]; then OUT="$d"; break; fi
          done
          if [ -z "$OUT" ]; then echo "No build output found"; ls -la; exit 1; fi
          SHELL_HTML=""
          for f in "$OUT/_shell.html" "$OUT/index.html"; do
            if [ -f "$f" ]; then SHELL_HTML="$f"; break; fi
          done
          if [ -z "$SHELL_HTML" ]; then echo "No HTML page found in $OUT"; find "$OUT" -maxdepth 2 -name "*.html"; exit 1; fi
          [ "$SHELL_HTML" != "$OUT/index.html" ] && cp "$SHELL_HTML" "$OUT/index.html"
          cp "$SHELL_HTML" "$OUT/404.html"
          touch "$OUT/.nojekyll"
          rm -rf site && cp -r "$OUT" site
          echo "Publishing from $OUT"; ls site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
